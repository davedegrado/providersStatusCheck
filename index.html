<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stato dei provider</title>
  <meta name="description" content="Stato dei servizi Cloudflare, Supabase, Railway, Resend, Firebase, Render e GitHub in un'unica pagina.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2316a34a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <header class="top">
    <h1>Stato dei provider</h1>
    <button id="tema" class="tema" type="button" aria-label="Cambia tema chiaro/scuro">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </header>

  <main>
    <section id="riepilogo" class="riepilogo" data-stato="sconosciuto" aria-live="polite">
      <p class="riepilogo-titolo">Caricamento…</p>
      <p class="riepilogo-dettaglio"></p>
    </section>

    <p id="avviso" class="avviso" role="status" hidden></p>

    <ul id="lista" class="lista"></ul>
  </main>

  <footer class="piede">
    <p>Controllo automatico ogni 10 minuti con GitHub Actions; dove il browser può leggere le API direttamente, la pagina si aggiorna da sola ogni 2 minuti.</p>
    <p id="generato"></p>
  </footer>
</body>
</html>
